
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CircadianGlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar styling */
    body {
      scrollbar-width: thin;
      scrollbar-color: #0ea5e9 #1f2937; /* sky-500 thumb, slate-800 track */
    }
    /* Webkit scrollbar */
    body::-webkit-scrollbar {
      width: 8px;
    }
    body::-webkit-scrollbar-track {
      background: #1f2937; /* slate-800 track */
    }
    body::-webkit-scrollbar-thumb {
      background-color: #0ea5e9; /* sky-500 thumb */
      border-radius: 10px;
      border: 2px solid #1f2937; /* slate-800 track, creates padding */
    }

    /* Custom scrollbar for Gemini Chat */
    .gemini-chat-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: #38bdf8 #1e293b; /* sky-400 thumb, slate-800 track */
    }
    .gemini-chat-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .gemini-chat-scrollbar::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 track */
    }
    .gemini-chat-scrollbar::-webkit-scrollbar-thumb {
      background-color: #38bdf8; /* sky-400 thumb */
      border-radius: 8px;
      border: 1px solid #1e293b; /* slate-800 track, creates padding */
    }

    /* Style for input type color */
    input[type="color"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 40px;
      height: 40px;
      border: none;
      cursor: pointer;
      padding: 0;
      border-radius: 0.375rem; /* rounded-md */
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
      border-radius: 0.375rem; /* rounded-md */
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 0.375rem; /* rounded-md */
    }
    input[type="color"]::-moz-color-swatch {
      border: none;
      border-radius: 0.375rem; /* rounded-md */
    }

    /* Global Focus Visible Styling */
    *:focus-visible {
      outline: 2px solid #0ea5e9; /* sky-500 */
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.2); /* sky-500 with alpha */
    }
    *:focus:not(:focus-visible) {
      outline: none;
      box-shadow: none;
    }

    /* Keyframes for animations */
    @keyframes subtle-icon-glow {
      0%, 100% { filter: drop-shadow(0 0 1px rgba(14, 165, 233, 0.3)) drop-shadow(0 0 3px rgba(14, 165, 233, 0.2)); opacity: 0.85; }
      50% { filter: drop-shadow(0 0 3px rgba(14, 165, 233, 0.5)) drop-shadow(0 0 6px rgba(14, 165, 233, 0.35)); opacity: 1; }
    }
    .animate-subtle-icon-glow {
      animation: subtle-icon-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.5), inset 0 0 0 1px rgba(14,165,233,0.4); } /* sky-500 */
      70% { box-shadow: 0 0 0 6px rgba(14, 165, 233, 0), inset 0 0 0 1.5px rgba(14,165,233,0.7); }
      100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0), inset 0 0 0 1px rgba(14,165,233,0.4); }
    }
    .animate-pulse-border {
      animation: pulse-border 0.7s ease-out;
      border-color: #0ea5e9 !important; /* sky-500 */
    }

    @keyframes ellipsis-dot1 {
      0%, 80%, 100% { opacity: 0; } 20% { opacity: 1; }
    }
    @keyframes ellipsis-dot2 {
      0%, 20%, 80%, 100% { opacity: 0; } 40% { opacity: 1; }
    }
    @keyframes ellipsis-dot3 {
      0%, 40%, 80%, 100% { opacity: 0; } 60% { opacity: 1; }
    }
    .animated-ellipsis span:nth-child(1) { animation: ellipsis-dot1 1.4s infinite; }
    .animated-ellipsis span:nth-child(2) { animation: ellipsis-dot2 1.4s infinite; }
    .animated-ellipsis span:nth-child(3) { animation: ellipsis-dot3 1.4s infinite; }

    /* For LightCard disabled color input pattern */
    .disabled-color-pattern {
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.05),
        rgba(255, 255, 255, 0.05) 2px,
        transparent 2px,
        transparent 4px
      );
    }
  </style>
<script type="importmap">
{

  }
}

</head>

<script type="module" src="/index.tsx"></script>
</body>
</html>
